description: "Integra MapLibre GL con capas WMS de ortofotos"
tools_required:
  - maplibre-gl: "^4.0.0"
  - react-map-gl: "^7.1.0"  # Wrapper declarativo
  - @turf/turf: "^6.5.0"    # Utilidades geoespaciales

inputs:
  - wms_sources: "Array de fuentes WMS configuradas"
  - default_view: "{ center: [lng, lat], zoom: number, projection: 'EPSG:3857' }"

outputs:
  - component: "src/components/map/MapViewerV2.tsx"
  - hooks: "src/hooks/useMapLayers.ts, useMapControls.ts"
  - config: "src/config/maps/wms-sources.ts"

execution_command: |
  npm run map:init -- --provider=maplibre --default-layer=osm

success_criteria:
  - "Mapa carga en < 2s con cache de navegador"
  - "Capa WMS se superpone con transparencia ajustable"
  - "Controles accesibles por teclado y screen reader"