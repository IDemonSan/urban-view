description: "Migraciones de esquema zero-downtime con Flyway"
tools_required:
  - flyway-core: "10.x"
  - postgresql: "15.x"
  - postgis: "3.3.x"

inputs:
  - migration_type: "add_column|add_index|modify_constraint"
  - table_name: "Nombre de tabla a modificar"
  - rollback_safe: "boolean - si la migración tiene rollback automático"

outputs:
  - migration_file: "backend/src/main/resources/db/migration/V*.sql"
  - rollback_file: "backend/src/main/resources/db/rollback/V*.sql"
  - validation_test: "src/test/java/.../MigrationV*Test.java"

execution_command: |
  ./scripts/migration-generate.sh --type=add_index --table=parcels --column=geom

success_criteria:
  - "Migración aplicable con flyway migrate sin downtime"
  - "Rollback probado en staging con 0 pérdida de datos"
  - "Constraints validados post-migración: 100% compliance"