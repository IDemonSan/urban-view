task_id: "DB-T3"
priority: "MEDIUM"
estimated_hours: 14
dependencies: ["DB-T1", "DB-T2"]
feature_flag: "enable-backup-monitoring"

subtasks:
  - id: "DB-T3.1"
    title: "Configurar pgBackRest para backups incrementales"
    description: |
      Backup diario completo + WAL archiving continuo. Configurar
      retención: 7 diarios, 4 semanales, 12 mensuales.
    commands:
      - "add pgbackrest service en docker-compose.yml"
      - "configurar pgbackrest.conf con retention policies"
      - "test restore en entorno aislado"
    acceptance_criteria:
      - "RPO ≤ 15 minutos, RTO ≤ 1 hora documentado y validado"
      - "Backup incremental reduce tiempo/storage vs full diario"
      - "Alertas si backup falla o se retrasa"
    output_artifacts:
      - "docker-compose.yml (actualizado con pgbackrest)"
      - "config/pgbackrest/pgbackrest.conf"
      - "docs/BACKUP_RECOVERY.md"

  - id: "DB-T3.2"
    title: "Implementar monitoreo de salud de base de datos"
    description: |
      Métricas clave: conexiones activas, locks, replication lag,
      bloat de tablas/índices, cache hit ratio. Dashboard en Grafana.
    commands:
      - "add postgres_exporter en docker-compose.yml"
      - "configurar Prometheus para scrape postgres_exporter"
      - "importar dashboard de PostgreSQL en Grafana"
    acceptance_criteria:
      - "Dashboard muestra métricas en tiempo real con refresh < 30s"
      - "Alertas proactivas antes de que issues afecten a usuarios"
      - "Documentación de umbrales de alerta en RUNBOOK.md"
    output_artifacts:
      - "monitoring/prometheus.yml (actualizado)"
      - "monitoring/grafana/dashboards/postgres.json"
      - "docs/DATABASE_MONITORING.md"

  - id: "DB-T3.3"
    title: "Configurar replication para alta disponibilidad (futuro)"
    description: |
      Streaming replication con PostgreSQL 15, preparar configuración
      para Patroni en futuro. Replicación sync para testing.
    commands:
      - "add postgresql.conf settings para replication"
      - "configurar pg_hba.conf para replication user"
      - "test failover manual en staging"
    acceptance_criteria:
      - "Replicación en modo sync, sin afectar writes en primary"
      - "Failover manual probado en staging con < 30 segundos de downtime"
      - "Documentación de pasos para escalar a Patroni"
    output_artifacts:
      - "config/postgresql/replication.conf"
      - "docs/HA_FUTURE_SETUP.md"

  - id: "DB-T3.4"
    title: "Automatizar VACUUM y ANALYZe para mantenimiento"
    description: |
      Ajustar autovacuum settings según patrón de writes:
      autovacuum_vacuum_scale_factor, autovacuum_analyze_scale_factor.
    commands:
      - "consultar patrones de write: SELECT schemaname, relname..."
      - "ajustar parámetros vía ALTER SYSTEM + reload"
      - "monitorear bloat pre/post cambios"
    acceptance_criteria:
      - "Tablas mantienen bloat < 20% sin intervención manual"
      - "ANALYZE actualiza estadísticas para query planner"
      - "Cambios no impactan performance de writes en horas pico"
    output_artifacts:
      - "scripts/tune-autovacuum.sh"
      - "docs/AUTOVACUUM_TUNING.md"

  - id: "DB-T3.5"
    title: "Documentar runbook de recovery paso a paso"
    description: |
      Checklist detallado: identificar punto de falla, restaurar
      desde backup, validar datos, reanudar servicio. Testing trimestral.
    commands:
      - "crear template de runbook en docs/RECOVERY_RUNBOOK.md"
      - "incluir comandos exactos, tiempos estimados, puntos de verificación"
      - "agendar testing trimestral en calendario del equipo"
    acceptance_criteria:
      - "Equipo puede ejecutar recovery completo en < 2 horas con documentación"
      - "Runbook probado en entorno aislado con datos de staging"
      - "Checklist incluye validación post-recovery de integridad"
    output_artifacts:
      - "docs/RECOVERY_RUNBOOK.md"
      - "scripts/test-recovery.sh"