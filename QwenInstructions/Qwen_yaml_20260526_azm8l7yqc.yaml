task_id: "FE-T4"
priority: "HIGH"
estimated_hours: 12
dependencies: ["FE-T1", "FE-T2"]
feature_flag: "enable-ci-gates"

subtasks:
  - id: "FE-T4.1"
    title: "Configurar feature flags con config simple"
    description: |
      Implementar provider de feature flags en root app usando
      archivo de configuración + override por query params.
    commands:
      - "create src/config/features.ts"
      - "create src/hooks/useFeatureFlag.ts"
      - "add query param parser para overrides en dev"
    acceptance_criteria:
      - "Sistema de flags operativo en dev/staging/prod"
      - "Override por ?flags=enableNewTheme funciona en dev"
      - "Flags por defecto: OFF para production"
    output_artifacts:
      - "src/config/features.ts"
      - "src/hooks/useFeatureFlag.ts"
      - "src/providers/FeatureFlagProvider.tsx"

  - id: "FE-T4.2"
    title: "Añadir tests de regresión visual"
    description: |
      Usar Playwright con snapshots para componentes clave
      del visor y sistema de temas.
    commands:
      - "npm install -D @playwright/test"
      - "configure playwright.config.ts para snapshots"
      - "add tests para ThemeToggle y MapViewerV2"
    acceptance_criteria:
      - "0 cambios visuales no autorizados en componentes legacy"
      - "Snapshots actualizados solo con aprobación explícita"
    output_artifacts:
      - "e2e/visual/theme-toggle.spec.ts"
      - "e2e/visual/map-viewer.spec.ts"
      - "playwright.config.ts"

  - id: "FE-T4.3"
    title: "Implementar E2E tests para flujos críticos"
    description: |
      Playwright tests para: login, búsqueda de terreno,
      cambio de tema, toggle de capas de mapa.
    commands:
      - "create e2e/tests/user-journeys.spec.ts"
      - "add fixtures para datos de test"
    acceptance_criteria:
      - "Cobertura E2E ≥ 80% en user journeys principales"
      - "Tests ejecutan en CI en < 5 minutos"
    output_artifacts:
      - "e2e/tests/user-journeys.spec.ts"
      - "e2e/fixtures/test-data.ts"

  - id: "FE-T4.4"
    title: "Pipeline CI con gates de calidad"
    description: |
      Actualizar GitHub Actions para incluir: lint → test → 
      a11y audit → build → e2e. Fallos en a11y solo warning
      en develop, error en main.
    commands:
      - "update .github/workflows/frontend-ci.yml"
      - "add steps para axe-core y lighthouse-ci"
    acceptance_criteria:
      - "PR no mergeable si falla build o tests críticos"
      - "Reports de a11y disponibles en artifacts de CI"
    output_artifacts:
      - ".github/workflows/frontend-ci.yml"
      - "scripts/ci-a11y-report.sh"