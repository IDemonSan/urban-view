description: "Valida y mejora cumplimiento WCAG 2.2 AA"
tools_required:
  - axe-core: "^4.8.0"
  - @axe-core/playwright: "^4.8.0"
  - lighthouse: "^11.0.0"
  - pa11y-ci: "^3.0.0"

inputs:
  - urls: "Array de rutas a auditar ['/','/parcels','/login']"
  - config: "Configuración WCAG: { level: 'AA', standard: 'WCAG2.2' }"

outputs:
  - report_path: "reports/a11y/audit-YYYYMMDD.json"
  - summary: "Objeto con { total_issues, critical, warning, passed }"
  - fix_suggestions: "Array de cambios de código sugeridos"

execution_command: |
  npm run audit:a11y -- --urls=/,/parcels --output=reports/a11y/

success_criteria:
  - "0 errores de contraste (ratio < 4.5:1 para texto normal)"
  - "Todos los interactivos accesibles por teclado"
  - "Lighthouse Accessibility Score ≥ 95"