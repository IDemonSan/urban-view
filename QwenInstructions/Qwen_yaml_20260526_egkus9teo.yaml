task_id: "BE-T1"
priority: "CRITICAL"
estimated_hours: 16
dependencies: []
feature_flag: "enable-security-hardening"

subtasks:
  - id: "BE-T1.1"
    title: "Ejecutar contenedores como non-root"
    description: |
      Añadir USER spring en Dockerfile backend + crear usuario
      en entrypoint script. Validar permisos de volúmenes.
    commands:
      - "update backend/Dockerfile con USER spring"
      - "create entrypoint.sh con chown para volúmenes"
      - "test: docker exec -it container id para verificar UID"
    acceptance_criteria:
      - "docker exec muestra proceso corriendo como UID != 0"
      - "Aplicación inicia sin errores de permisos"
      - "Volúmenes montados tienen permisos correctos"
    output_artifacts:
      - "backend/Dockerfile (actualizado)"
      - "backend/entrypoint.sh"

  - id: "BE-T1.2"
    title: "Eliminar exposición directa de puertos"
    description: |
      Remover ports: "8080:8080" en docker-compose.yml para
      backend, dejar solo acceso vía nginx-proxy.
    commands:
      - "update docker-compose.yml: comentar ports de api-backend"
      - "verify nginx-proxy routing a backend via internal network"
    acceptance_criteria:
      - "curl localhost:8080 falla desde host"
      - "curl localhost:80 (nginx) rutea correctamente a backend"
      - "Logs de nginx muestran proxy_pass a api-backend:8080"
    output_artifacts:
      - "docker-compose.yml (actualizado)"
      - "proxy/nginx.conf (verificado)"

  - id: "BE-T1.3"
    title: "Integrar escaneo de vulnerabilidades en CI"
    description: |
      Añadir step con aquasec/trivy en GitHub Actions para
      escanear imágenes Docker antes de push a registry.
    commands:
      - "update .github/workflows/backend-ci.yml"
      - "add step: Run Trivy vulnerability scanner"
      - "configurar --exit-code 0 inicialmente para solo reporte"
    acceptance_criteria:
      - "Reporte de CVEs disponible en artifacts de CI"
      - "Build no falla por vulnerabilidades (modo reporte)"
      - "Documentación en SECURITY.md sobre proceso de escaneo"
    output_artifacts:
      - ".github/workflows/backend-ci.yml (actualizado)"
      - "SECURITY.md (actualizado)"

  - id: "BE-T1.4"
    title: "Configurar Spring Security con mejores prácticas"
    description: |
      Habilitar CSRF, headers de seguridad (HSTS, X-Frame-Options),
      validación de input con @Valid, rate limiting básico.
    commands:
      - "update SecurityConfig.java con headers de seguridad"
      - "add @Valid en DTOs de entrada"
      - "configurar csrf para endpoints stateless"
    acceptance_criteria:
      - "OWASP ZAP scan sin vulnerabilidades críticas/altas"
      - "Headers de seguridad presentes en respuestas HTTP"
      - "Input validation rechaza payloads maliciosos"
    output_artifacts:
      - "backend/src/main/java/.../SecurityConfig.java"
      - "backend/src/main/java/.../dto/ (actualizado con @Valid)"

  - id: "BE-T1.5"
    title: "Implementar rate limiting en nginx-proxy"
    description: |
      Configurar limit_req_zone y limit_req en nginx.conf para
      proteger endpoints críticos de abuso.
    commands:
      - "update proxy/nginx.conf con limit_req_zone en http block"
      - "add limit_req en location /api"
      - "configurar status 429 y headers Retry-After"
    acceptance_criteria:
      - "Requests > 10/min desde misma IP reciben 429"
      - "Header Retry-After presente en respuestas limitadas"
      - "Logs de nginx registran requests limitados"
    output_artifacts:
      - "proxy/nginx.conf (actualizado)"
      - "docs/RATE_LIMITING.md"