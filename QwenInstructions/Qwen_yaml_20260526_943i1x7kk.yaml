task_id: "BE-T3"
priority: "MEDIUM"
estimated_hours: 16
dependencies: ["BE-T1"]
feature_flag: "enable-api-versioning"

subtasks:
  - id: "BE-T3.1"
    title: "Definir estrategia de versionado (URI path)"
    description: |
      Usar /api/v1/parcels como base, preparar estructura para
      /api/v2/ con documentación clara de cambios.
    commands:
      - "refactor controllers a paquete .../api/v1/"
      - "crear estructura paralela para v2 (vacía inicialmente)"
      - "update OpenAPI docs con versiones"
    acceptance_criteria:
      - "Documentación OpenAPI muestra ambas versiones claramente"
      - "Tests de integración para v1 siguen pasando"
      - "Estructura de paquetes clara para futuras versiones"
    output_artifacts:
      - "backend/src/main/java/.../api/v1/ (refactored)"
      - "backend/src/main/resources/openapi/v1.yaml"

  - id: "BE-T3.2"
    title: "Implementar content negotiation para versionado"
    description: |
      Configurar ApiVersionStrategy de Spring Boot para soportar
      versionado por header Accept-Version con fallback a v1.
    commands:
      - "create config/ApiVersionConfig.java"
      - "implementar RequestCondition para versionado"
      - "add fallback logic a v1 si no se especifica versión"
    acceptance_criteria:
      - "Clientes legacy funcionan sin cambios (fallback a v1)"
      - "Clientes nuevos pueden usar header Accept-Version: v2"
      - "Logs registran versión usada para debugging"
    output_artifacts:
      - "backend/src/main/java/.../config/ApiVersionConfig.java"
      - "backend/src/main/java/.../condition/ApiVersionCondition.java"

  - id: "BE-T3.3"
    title: "Añadir deprecación progresiva con headers"
    description: |
      Usar headers Deprecation y Sunset en respuestas v1 para
      comunicar timeline de obsolescencia a clientes.
    commands:
      - "create interceptor AddDeprecationHeadersInterceptor"
      - "configurar fechas de sunset en application.yml"
      - "add logging para trackear uso de endpoints deprecated"
    acceptance_criteria:
      - "Respuestas v1 incluyen header Deprecation: true"
      - "Header Sunset con fecha ISO 8601 cuando aplique"
      - "Métricas de uso de endpoints deprecated disponibles"
    output_artifacts:
      - "backend/src/main/java/.../interceptor/DeprecationInterceptor.java"
      - "docs/API_DEPRECATION_POLICY.md"

  - id: "BE-T3.4"
    title: "Generar documentación OpenAPI 3.1 automática"
    description: |
      Integrar springdoc-openapi con ejemplos por versión,
      esquemas de request/response y códigos de error.
    commands:
      - "add springdoc-openapi-starter-webmvc-ui dependency"
      - "configurar GroupedOpenApi para v1 y v2"
      - "add @Operation examples en controllers"
    acceptance_criteria:
      - "Swagger UI muestra ejemplos de request/response para v1 y v2"
      - "Documentación accesible en /swagger-ui.html y /v3/api-docs"
      - "Schema validation pasa para ejemplos documentados"
    output_artifacts:
      - "backend/src/main/java/.../config/OpenApiConfig.java"
      - "backend/src/main/resources/openapi/ (actualizado)"

  - id: "BE-T3.5"
    title: "Testing de compatibilidad hacia atrás"
    description: |
      Tests de integración que validan que v1 no cambia
      comportamiento tras añadir v2 o nuevas features.
    commands:
      - "create test suite: ApiV1CompatibilityTest"
      - "usar Testcontainers para DB real en tests"
      - "assert responses v1 idénticas pre/post cambios"
    acceptance_criteria:
      - "100% de tests de compatibilidad pasan en cada PR"
      - "CI falla si hay breaking changes detectados en v1"
      - "Reporte de diferencias disponible en artifacts"
    output_artifacts:
      - "backend/src/test/java/.../ApiV1CompatibilityTest.java"
      - "scripts/validate-api-compatibility.sh"