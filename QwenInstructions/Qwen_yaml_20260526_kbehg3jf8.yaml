description: "Optimiza consultas PostGIS y configuración de rendimiento"
tools_required:
  - pg_stat_statements: "extensión PostgreSQL"
  - micrometer-registry-prometheus: "Spring Boot Actuator"
  - k6: "load testing"

inputs:
  - slow_queries_threshold: "Tiempo en ms para considerar query lenta"
  - target_p95: "Percentil 95 objetivo para respuestas API"

outputs:
  - optimization_report: "reports/perf/optimization-YYYYMMDD.md"
  - migration_scripts: "db/migration/V*_optimize_*.sql"
  - config_updates: "application-prod.yml con tuning"

execution_command: |
  ./scripts/perf-analyze.sh --db=urban_view --threshold=500

success_criteria:
  - "p95 de endpoints geoespaciales < 500ms"
  - "Índices GIST usados en 100% de queries espaciales"
  - "Pool de conexiones: 0 timeouts, < 100ms acquisition"