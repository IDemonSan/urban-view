task_id: "BE-T2"
priority: "HIGH"
estimated_hours: 20
dependencies: ["BE-T1"]
feature_flag: "enable-performance-optimizations"

subtasks:
  - id: "BE-T2.1"
    title: "Añadir índices GIST en columnas geométricas"
    description: |
      Script de migración con CREATE INDEX CONCURRENTLY para
      columnas geométricas en tablas de terrenos/parcels.
    commands:
      - "create db/migration/V2__add_geom_indexes.sql"
      - "usar CONCURRENTLY para evitar locks en producción"
      - "add ANALYZE post-creación de índice"
    acceptance_criteria:
      - "EXPLAIN ANALYZE muestra Index Scan en queries espaciales"
      - "Migración aplicable sin downtime perceptible"
      - "Rollback script disponible y probado"
    output_artifacts:
      - "backend/src/main/resources/db/migration/V2__add_geom_indexes.sql"
      - "backend/src/main/resources/db/rollback/V2__rollback.sql"

  - id: "BE-T2.2"
    title: "Configurar HikariCP para conexión eficiente"
    description: |
      Ajustar maximum-pool-size, connection-timeout, idle-timeout
      según carga esperada y recursos del contenedor.
    commands:
      - "update application-prod.yml con Hikari config"
      - "valores iniciales conservadores: pool-size=10, timeout=30s"
      - "add actuator endpoint para métricas de pool"
    acceptance_criteria:
      - "Métricas de pool: 0 timeouts, < 100ms acquisition time"
      - "Load test: pool no se satura con 50 reqs/seg"
      - "Logs de Hikari en nivel WARN solo si hay issues"
    output_artifacts:
      - "backend/src/main/resources/application-prod.yml"
      - "docs/DATABASE_TUNING.md"

  - id: "BE-T2.3"
    title: "Implementar caching de consultas frecuentes"
    description: |
      Integrar Spring Cache + Redis para resultados de búsqueda
      de terrenos con TTL configurable y invalidación manual.
    commands:
      - "add spring-boot-starter-cache y spring-boot-starter-data-redis"
      - "annotate service methods con @Cacheable"
      - "configurar Redis en docker-compose.yml"
    acceptance_criteria:
      - "Reducción ≥ 40% en tiempo de respuesta para queries repetidas"
      - "Cache invalidado al actualizar terreno ( @CacheEvict )"
      - "Métricas de hit/miss ratio disponibles en actuator"
    output_artifacts:
      - "backend/src/main/java/.../config/CacheConfig.java"
      - "backend/src/main/java/.../service/ParcelService.java (actualizado)"

  - id: "BE-T2.4"
    title: "Tuning de JVM para contenedores Docker"
    description: |
      Configurar flags de JVM: -XX:+UseContainerSupport,
      -XX:MaxRAMPercentage=75.0, G1GC para mejor gestión de memoria.
    commands:
      - "update backend/Dockerfile con JAVA_TOOL_OPTIONS"
      - "add perfil JVM 'container' en application.yml"
    acceptance_criteria:
      - "Heap usage estable sin OOM en load testing de 1 hora"
      - "GC pauses < 200ms en percentil 99"
      - "Container memory limit respetado sin kill"
    output_artifacts:
      - "backend/Dockerfile (actualizado con JVM flags)"
      - "docs/JVM_TUNING.md"

  - id: "BE-T2.5"
    title: "Añadir métricas con Micrometer + Prometheus"
    description: |
      Exponer endpoints /actuator/prometheus con métricas custom
      para latencia de queries geoespaciales y error rates.
    commands:
      - "add micrometer-registry-prometheus dependency"
      - "create custom Timer para queries espaciales"
      - "update prometheus.yml para scrape backend"
    acceptance_criteria:
      - "Dashboard de Grafana muestra latencia, error rate, throughput"
      - "Alertas configuradas para p95 > 500ms"
      - "Métricas custom etiquetadas por endpoint y región"
    output_artifacts:
      - "backend/src/main/java/.../config/MetricsConfig.java"
      - "monitoring/prometheus.yml"
      - "monitoring/grafana/dashboards/urban-view.json"