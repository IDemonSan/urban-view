task_id: "FE-T3"
priority: "MEDIUM"
estimated_hours: 20
dependencies: ["FE-T1"]
feature_flag: "enable-a11y-improvements"

subtasks:
  - id: "FE-T3.1"
    title: "Auditoría inicial de accesibilidad"
    description: |
      Ejecutar axe-core en rutas principales para generar baseline
      de issues de accesibilidad priorizados por severidad.
    commands:
      - "npm run audit:a11y -- --urls=/,/parcels,/login --baseline"
    acceptance_criteria:
      - "Reporte baseline guardado en reports/a11y/baseline.json"
      - "Lista priorizada de issues con estimación de esfuerzo"
    output_artifacts:
      - "reports/a11y/baseline-YYYYMMDD.json"
      - "docs/ACCESSIBILITY_BASELINE.md"

  - id: "FE-T3.2"
    title: "Corregir contraste en componentes críticos"
    description: |
      Aplicar tokens de T1.1 a botones, inputs, textos de estado
      para cumplir ratio de contraste WCAG 2.2 AA.
    commands:
      - "update components con css variables de tokens.css"
      - "run validate:a11y para verificar correcciones"
    acceptance_criteria:
      - "0 errores de contraste en auditoría post-implementación"
      - "Componentes críticos: buttons, inputs, alerts, badges"
    output_artifacts:
      - "src/components/ui/Button/Button.tsx (actualizado)"
      - "src/components/ui/Input/Input.tsx (actualizado)"

  - id: "FE-T3.3"
    title: "Mejorar navegación por teclado"
    description: |
      Añadir tabIndex lógico, skip links, foco visible en todos
      los elementos interactivos. Validar orden de tab.
    commands:
      - "add skip link en App.tsx"
      - "revisar tabIndex en componentes interactivos"
      - "test manual con teclado: Tab, Shift+Tab, Enter, Space"
    acceptance_criteria:
      - "Navegación completa sin mouse en flujos críticos"
      - "Orden de tab lógico y predecible"
      - "Skip link lleva al contenido principal con 1 tab"
    output_artifacts:
      - "src/components/ui/SkipLink.tsx"
      - "docs/KEYBOARD_NAVIGATION.md"

  - id: "FE-T3.4"
    title: "Implementar ARIA landmarks y roles"
    description: |
      Estructurar página con <main>, <nav>, role="search",
      aria-labelledby para secciones dinámicas.
    commands:
      - "add landmarks en Layout.tsx"
      - "update componentes dinámicos con aria-live"
    acceptance_criteria:
      - "Lighthouse 'Names and labels' = 100%"
      - "Screen reader navega por landmarks correctamente"
    output_artifacts:
      - "src/layouts/MainLayout.tsx (actualizado)"
      - "src/utils/aria-helpers.ts"

  - id: "FE-T3.5"
    title: "Testing con screen readers"
    description: |
      Pruebas manuales con NVDA (Windows) y VoiceOver (macOS)
      para flujos críticos: búsqueda de terreno, cambio de tema.
    commands:
      - "documentar pasos de testing en CHECKLIST_A11Y.md"
      - "ejecutar pruebas manuales y registrar hallazgos"
    acceptance_criteria:
      - "Checklist de compatibilidad completado para flujos críticos"
      - "0 bloqueos críticos reportados por screen reader"
    output_artifacts:
      - "docs/CHECKLIST_A11Y.md"
      - "reports/a11y/screen-reader-tests.md"