description: "Implementa sistema de temas claro/oscuro con tokens CSS"
tools_required:
  - tailwindcss: "^4.0.0"
  - @tailwindcss/forms: "^0.5.0"
  - class-variance-authority: "^0.7.0"

inputs:
  - design_tokens: "Objeto con colores, espaciados, tipografías"
  - wcag_contrast: "Mapa de pares válidos { bg: [text1, text2] }"

outputs:
  - tokens_file: "src/styles/tokens.css"
  - tailwind_config: "tailwind.config.js actualizado"
  - migration_script: "scripts/migrate-classes.mjs"

execution_command: |
  npm run theme:generate -- --tokens=src/config/tokens.json

success_criteria:
  - "Cambio de tema sin recarga de página"
  - "Persistencia en localStorage + prefers-color-scheme"
  - "100% de componentes legacy renderizan con nuevo sistema"