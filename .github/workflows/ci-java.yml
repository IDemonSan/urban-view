name: CI - Java Backend
on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      EXIT_CODE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build and Test with Maven
        working-directory: ./backend
        run: mvn -B -V -ntp clean verify
      
      - name: Package for Docker
        working-directory: ./backend
        run: mvn -B -ntp package -DskipTests
      
      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t urbanview-backend:ci .
      
      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --format table --exit-code $EXIT_CODE urbanview-backend:ci
      
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30
